<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>천하제일점 QR 코드 보드 🖨️</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f4f4f9;
            padding: 40px;
            text-align: center;
        }
        h1 { color: #333; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 40px; }
        .qr-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 30px;
        }
        .qr-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .qr-card img {
            width: 150px;
            height: 150px;
            margin-bottom: 15px;
        }
        .table-num {
            font-size: 18px;
            font-weight: bold;
            color: #6750A4;
        }
        .url-text {
            font-size: 10px;
            color: #999;
            margin-top: 10px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <h1>📍 천하제일점 테이블 QR 코드판</h1>
    <p>아래 QR 코드를 실제 스마트폰 카메라로 찍으시면 메뉴판으로 즉시 연결됩니다.<br>
    (반드시 맥북과 스마트폰이 <b>같은 Wi-Fi</b>에 연결되어 있어야 합니다!)</p>

    <div class="qr-grid" id="qr-container">
        <!-- JS로 QR 코드가 생성됩니다 -->
    </div>

    <script>
        async function initQrBoard() {
            let serverUrl = "";
            try {
                const res = await fetch('/api/store/config');
                const data = await res.json();

                // [개선] 터널 주소가 있으면 5G 접속을 위해 우선적으로 사용
                if (data.tunnelUrl && data.tunnelUrl.startsWith('https://')) {
                    serverUrl = data.tunnelUrl;
                } else if (data.storeIp) {
                    serverUrl = `http://${data.storeIp}:8888`;
                }
            } catch (e) {
                serverUrl = `http://${window.location.host}`;
            }

            const container = document.getElementById('qr-container');
            container.innerHTML = '';

            for (let i = 1; i <= 20; i++) {
                const orderUrl = `${serverUrl}/menu?table=${i}`;
                const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(orderUrl)}`;

                const card = document.createElement('div');
                card.className = 'qr-card';
                card.innerHTML = `
                    <div class="table-num">${i}번 테이블</div>
                    <img src="${qrImageUrl}" alt="Table ${i} QR">
                    <div class="url-text">${orderUrl}</div>
                `;
                container.appendChild(card);
            }
        }
        initQrBoard();
    </script>
</body>
</html>
