<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Starlink 기기 초기 세팅</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f5f5f7; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .card { background: white; border-radius: 20px; padding: 30px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        h1 { color: #1d1d1f; font-size: 24px; margin-top: 0; text-align: center; }
        .subtitle { color: #86868b; font-size: 14px; text-align: center; margin-bottom: 30px; }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 13px; font-weight: bold; color: #1d1d1f; margin-bottom: 8px; }
        input, select { width: 100%; padding: 14px; border: 1px solid #d2d2d7; border-radius: 12px; font-size: 16px; box-sizing: border-box; outline: none; transition: border-color 0.2s; }
        input:focus, select:focus { border-color: #0071e3; }

        .radio-group { display: flex; gap: 10px; }
        .radio-btn { flex: 1; padding: 12px; text-align: center; border: 1px solid #d2d2d7; border-radius: 12px; cursor: pointer; font-size: 14px; font-weight: bold; color: #1d1d1f; transition: all 0.2s; }
        .radio-btn.active { background: #0071e3; color: white; border-color: #0071e3; }

        .btn-submit { width: 100%; padding: 16px; background: #0071e3; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
        .btn-submit:active { background: #005bb5; }

        /* PIN 잠금 화면 */
        #pin-screen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.95); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; backdrop-filter: blur(10px); }
        .pin-box { background: white; padding: 40px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); text-align: center; width: 80%; max-width: 320px; }
        .pin-input { font-size: 24px; letter-spacing: 8px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<!-- PIN 인증 화면 -->
<div id="pin-screen">
    <div class="pin-box">
        <h2 style="margin-top:0; color:#1d1d1f;">🔒 보안 인증</h2>
        <p style="color:#86868b; font-size:14px; line-height:1.5;">기기 바닥에 부착된<br>6자리 PIN 번호를 입력하세요.</p>
        <input type="tel" id="pin-input" class="pin-input" maxlength="6" placeholder="000000" autocomplete="off">
        <button class="btn-submit" onclick="verifyPin()">인증하기</button>
        <p id="pin-error" style="color:#ff3b30; font-size:13px; font-weight:bold; display:none; margin-top:15px;">PIN 번호가 일치하지 않습니다.</p>
    </div>
</div>

<!-- 세팅 화면 -->
<div class="card" id="setup-screen" style="display:none;">
    <h1>✨ 기기 초기 세팅</h1>
    <div class="subtitle" id="device-id-display">시리얼 감지중...</div>

    <div class="form-group">
        <label>매장 상호명</label>
        <input type="text" id="store-name" placeholder="예: 스타링크 강남점">
    </div>

    <div class="form-group">
        <label>업종 (테마) 선택</label>
        <div class="radio-group" id="type-group">
            <div class="radio-btn active" onclick="selectType('CAFE')">☕ 카페</div>
            <div class="radio-btn" onclick="selectType('PUB')">🍻 주점</div>
            <div class="radio-btn" onclick="selectType('RESTAURANT')">🍽️ 식당</div>
        </div>
    </div>

    <div class="form-group">
        <label>영업사원 사번 (담당자)</label>
        <input type="text" id="agent-id" placeholder="예: A105">
    </div>

    <div class="form-group">
        <label>손님용 Wi-Fi 비밀번호 (선택)</label>
        <input type="text" id="wifi-pw" placeholder="미입력 시 메뉴판에 표시 안 됨">
    </div>

    <button class="btn-submit" onclick="submitSetup()">완료 및 기기 잠금 🔒</button>
</div>

<script>
    let currentConfig = null;
    let selectedType = 'CAFE';

    async function checkStatus() {
        try {
            const res = await fetch('/api/store/config?internal_setup=true');
            if (res.ok) {
                currentConfig = await res.json();
                document.getElementById('device-id-display').innerText = `기기 고유번호: ${currentConfig.storeId}`;

                // 이미 세팅이 끝난 기기라면 접근 차단
                if (currentConfig.isSetupComplete) {
                    document.body.innerHTML = `
                        <div style="text-align:center; padding:50px;">
                            <h1 style="font-size:50px; margin-bottom:10px;">🔒</h1>
                            <h2>접근 거부</h2>
                            <p style="color:#666;">이 기기는 이미 세팅이 완료되어 영구 잠금 상태입니다.<br>수정이 필요하면 본사에 문의하세요.</p>
                        </div>
                    `;
                }
            }
        } catch(e) {
            alert('기기와 통신할 수 없습니다.');
        }
    }

    async function verifyPin() {
        const pin = document.getElementById('pin-input').value;
        try {
            const res = await fetch('/api/setup/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pin: pin })
            });
            const result = await res.json();

            if (result.success) {
                document.getElementById('pin-screen').style.display = 'none';
                document.getElementById('setup-screen').style.display = 'block';
            } else {
                document.getElementById('pin-error').style.display = 'block';
            }
        } catch(e) {
            alert('인증 서버 에러');
        }
    }

    function selectType(type) {
        selectedType = type;
        document.querySelectorAll('.radio-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
    }

    async function submitSetup() {
        const storeName = document.getElementById('store-name').value;
        const agentId = document.getElementById('agent-id').value;
        const wifiPw = document.getElementById('wifi-pw').value;

        if(!storeName) return alert('상호명을 입력해주세요.');

        const pin = document.getElementById('pin-input').value; // 인증에 썼던 PIN 재전송

        try {
            const res = await fetch('/api/setup/complete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    pin: pin,
                    storeName: storeName,
                    storeType: selectedType,
                    agentId: agentId || "UNKNOWN",
                    wifiPw: wifiPw
                })
            });

            if (res.ok) {
                document.body.innerHTML = `
                    <div style="text-align:center; padding:50px; background:white; border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,0.1); width:100%; max-width:400px;">
                        <h1 style="font-size:50px; margin-bottom:10px;">🎉</h1>
                        <h2>세팅 완료!</h2>
                        <p style="color:#666; font-weight:bold; margin-bottom:20px;">[${storeName}]<br>이제 기기가 재시작되며 즉시 영업을 시작할 수 있습니다.</p>
                        <p style="color:#ff3b30; font-size:12px;">보안을 위해 이 페이지는 더 이상 접근할 수 없습니다.</p>
                    </div>
                `;
            } else {
                alert('세팅 저장 중 오류가 발생했습니다.');
            }
        } catch(e) {
            alert('통신 오류');
        }
    }

    checkStatus();
</script>
</body>
</html>
